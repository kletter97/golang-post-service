version: '3.8'

services:
  # база данных
  postgres-test:
    image: postgres:latest
    container_name: postgres-test
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # go-сервер
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: go-server-app
    ports:
      - "8090:8090"
    depends_on:
      postgres-test:
        condition: service_healthy
    env_file:
      - .env

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-test
    ports:
      - "5672:5672"   # Порт для общения Go-приложения с брокером
      - "15672:15672" # Порт для веб-админки (логин: guest, пароль: guest)
    env_file:
      - .env
  
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-test
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-test
    ports:
      - "3000:3000" # Веб-интерфейс графаны
volumes:
  pgdata: # Чтобы данные базы не пропадали при перезапуске контейнера